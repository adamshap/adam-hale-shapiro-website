<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website link preview</title>
  <link rel="stylesheet" href="../docs/assets/style.css">
  <style>
    /* Render at 1200 × 630; the banner inherits the website's opacity and fade. */
    html,body { margin:0; width:1200px; height:630px; overflow:hidden; background:#fff; }
    body { padding:48px 64px; color:#233342; }
    .name { font-size:56px; font-weight:400; line-height:1.15; letter-spacing:-1.1px; margin:0 0 30px; }
    .tree-banner { width:1200px; margin:0 -64px; }
    .tree-banner img { width:100%; height:268px; }
    .topics { font-size:27px; font-weight:400; line-height:1.4; margin:30px 0 0; color:#52616b; }
    .url { font-size:23px; line-height:1.4; margin:13px 0 0; color:#6a2036; }
  </style>
</head>
<body>
  <h1 class="name">Adam Hale Shapiro</h1>
  <div class="tree-banner"><img src="../docs/assets/forest-banner.jpg" alt="Snow-covered trees" width="1600" height="440"></div>
  <p class="topics">Research &nbsp;·&nbsp; Economic Letters &nbsp;·&nbsp; Code &amp; Data</p>
  <p class="url">adam-hale-shapiro.com</p>
</body>
</html>
